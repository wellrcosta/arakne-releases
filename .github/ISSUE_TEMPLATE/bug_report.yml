name: Bug report
description: Something in Arakne is not working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        > [!WARNING]
        > **This issue is public.** Never include credentials, customer or personal data, or files from a real bot. Use fictitious data and review every attachment.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Click...
        3. See the error...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Arakne version
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11, macOS 15, Ubuntu 24.04..."
    validations:
      required: true
  - type: checkboxes
    id: public-data
    attributes:
      label: Public data check
      options:
        - label: I reviewed the text and attachments, and they contain no sensitive data.
          required: true
